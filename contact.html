  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/index.html">2-2-100 <span>Entertainment</span></a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" id="navLinks">
          <a href="/index.html">Home</a>
          <a href="/services.html">Services</a>
          <a href="/work.html">Work</a>
          <a href="/about.html">About</a>
          <a href="/contact.html" class="nav-cta">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="section">
        <div class="container contact">
          <p class="eyebrow">Contact</p>
          <h2>Let's build something.</h2>
          <p class="section-sub">Have a project in mind? Reach out and we'll talk.</p>
          <div class="contact-card">
            <div class="contact-row">
              <span>Location</span><strong>Tacoma, WA</strong>
            </div>
            <div class="contact-row">
              <span>Company</span><strong>2-2-100 Entertainment LLC</strong>
            </div>
            <div class="contact-row">
              <span>Contact</span><strong>Use the form below</strong>
            </div>
          </div>

          <form class="contact-form" id="contactForm" style="margin-top:2rem;display:grid;gap:1rem">
            <label>Name<input type="text" name="name" required style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)" /></label>
            <label>Email<input type="email" name="email" required style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)" /></label>
            <label>Project type
              <select name="type" style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)">
                <option>Generative AI app</option><option>Agentic system</option><option>Audio / DSP</option><option>Cloud &amp; DevOps</option><option>Other</option>
              </select>
            </label>
            <label>Message<textarea name="message" rows="5" required style="width:100%;padding:.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)"></textarea></label>
            <button type="submit" class="btn btn-primary" style="justify-self:start">Send message</button>
            <p id="formStatus" class="muted" role="status"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2-2-100 Entertainment LLC. Built with care in Tacoma, WA.</p>
      </div>
    </footer>

  </body>
