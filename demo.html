<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent demo — 2-2-100 Entertainment LLC" />
    <meta property="og:title" content="Demo · 2-2-100 Entertainment LLC" />
    <meta property="og:type" content="website" />
    <title>Demo · 2-2-100 Entertainment LLC</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/index.html">2-2-100 <span>Entertainment</span></a>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" id="navLinks">
          <a href="/index.html">Home</a>
          <a href="/services.html">Services</a>
          <a href="/work.html">Work</a>
          <a href="/about.html">About</a>
          <a href="/blog.html">Blog</a>
          <a href="/contact.html" class="nav-cta">Contact</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <section class="section">
        <div class="container" style="max-width:720px">
          <p class="eyebrow">Demo</p>
          <h1 style="letter-spacing:-0.02em">Try the agent</h1>
          <p class="section-sub">A lightweight, client-side demo of a conversational agent. Responses are canned to showcase UX; a real deployment wires this to a model endpoint.</p>
          <div id="chat" style="margin-top:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;min-height:260px;max-height:400px;overflow:auto;display:flex;flex-direction:column;gap:.75rem"></div>
          <form id="chatForm" style="margin-top:1rem;display:flex;gap:.5rem">
            <input id="chatInput" type="text" placeholder="Ask something…" style="flex:1;padding:.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)" />
            <button class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer"><div class="container"><p>© 2-2-100 Entertainment LLC. Built with care in Tacoma, WA.</p></div></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      const chat = document.getElementById('chat')
      const form = document.getElementById('chatForm')
      const input = document.getElementById('chatInput')
      const replies = [
        "I can help design agentic systems, generative AI apps, and cloud deployments.",
        "GTRTONE ASP and Rally Up Bots are two projects I'm proud of — want details?",
        "For audio/DSP work, I combine local inference with real-time processing.",
        "Reach out via the contact page to start a project.",
      ]
      let i = 0
      const add = (text, who) => {
        const el = document.createElement('div')
        el.textContent = text
        el.style.padding = '.6rem .9rem'
        el.style.borderRadius = '10px'
        el.style.maxWidth = '80%'
        el.style.alignSelf = who === 'user' ? 'flex-end' : 'flex-start'
        el.style.background = who === 'user' ? 'var(--accent)' : 'var(--surface-2)'
        el.style.color = who === 'user' ? '#fff' : 'var(--text)'
        chat.appendChild(el)
        chat.scrollTop = chat.scrollHeight
      }
      form.addEventListener('submit', (e) => {
        e.preventDefault()
        const v = input.value.trim()
        if (!v) return
        add(v, 'user')
        input.value = ''
        setTimeout(() => add(replies[i++ % replies.length], 'bot'), 400)
      })
      add("Hi! I'm a demo agent for 2-2-100 Entertainment. Ask me anything.", 'bot')
    </script>
  </body>
</html>
